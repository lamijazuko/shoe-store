<div class="page-header">
    <div>
        <h1 class="page-title">My profile</h1>
        <p class="page-subtitle">Your personal information and preferences.</p>
    </div>
</div>

<div class="row g-3">
    <div class="col-lg-4">
        <div class="card text-center">
            <div class="card-body">
                <div class="avatar avatar-lg mx-auto mb-3">AK</div>
                <h5 class="fw-bold mb-0">Anna Kovač</h5>
                <p class="text-muted small mb-2">admin@shoestore.dev</p>
                <span class="badge text-bg-primary">admin</span>
            </div>
        </div>
    </div>

    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">Account details</div>
            <div class="card-body">
                <form>
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label for="name" class="form-label">Full name</label>
                            <input type="text" class="form-control" id="name" value="Anna Kovač">
                        </div>
                        <div class="col-sm-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" value="admin@shoestore.dev">
                        </div>
                        <div class="col-sm-6">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" value="+387 61 111 222">
                        </div>
                        <div class="col-sm-6">
                            <label for="city" class="form-label">City</label>
                            <input type="text" class="form-control" id="city" value="Sarajevo">
                        </div>
                        <div class="col-12">
                            <label for="address" class="form-label">Address</label>
                            <input type="text" class="form-control" id="address" value="Zmaja od Bosne 10">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> Save changes</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
