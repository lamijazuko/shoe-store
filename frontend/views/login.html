<div class="auth-card card shadow-sm mx-auto my-4">
    <div class="card-body">
        <div class="text-center mb-4">
            <img src="assets/img/logo.svg" class="auth-logo mb-2" alt="ShoeStore">
            <h4 class="fw-bold mb-0">Welcome to ShoeStore</h4>
            <p class="text-muted small mb-0">Sign in to start shopping for your next pair</p>
        </div>

        <!-- Static page – no backend yet -->
        <form>
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="you@example.com">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••">
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label small" for="remember">Remember me</label>
                </div>
                <a href="#" class="small">Forgot password?</a>
            </div>
            <a href="#dashboard" class="btn btn-primary w-100">Sign in</a>
            <p class="text-center small text-muted mt-3 mb-0">
                No account yet? <a href="#register">Create one</a>
            </p>
        </form>
    </div>
</div>
