<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShoeStore</title>
    <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 + Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- SPApp + our styles -->
    <link rel="stylesheet" href="css/spapp.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

    <!-- ===== Sidebar (offcanvas on mobile, fixed column on desktop) ===== -->
    <aside class="sidebar">
        <div class="offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar">
            <div class="offcanvas-header">
                <a href="#dashboard" class="brand"><img src="assets/img/logo.svg" alt=""> ShoeStore</a>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body flex-column">
                <a href="#dashboard" class="brand d-none d-lg-flex"><img src="assets/img/logo.svg" alt=""> ShoeStore</a>

                <nav class="nav flex-column" id="main-nav">
                    <span class="nav-section">Store</span>
                    <a class="nav-link" href="#dashboard"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                    <a class="nav-link" href="#products"><i class="bi bi-box-seam"></i> Products</a>
                    <a class="nav-link" href="#cart"><i class="bi bi-cart3"></i> Cart</a>
                    <a class="nav-link" href="#checkout"><i class="bi bi-credit-card"></i> Checkout</a>
                    <a class="nav-link" href="#orders"><i class="bi bi-receipt"></i> Orders</a>

                    <span class="nav-section">Account</span>
                    <a class="nav-link" href="#profile"><i class="bi bi-person-circle"></i> My profile</a>
                    <a class="nav-link" href="#login"><i class="bi bi-box-arrow-right"></i> Log out</a>
                </nav>
            </div>
        </div>
    </aside>

    <div class="app-main">
        <!-- ===== Top bar ===== -->
        <header class="topbar">
            <button class="btn btn-light d-lg-none me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Open menu">
                <i class="bi bi-list"></i>
            </button>
            <span class="topbar-title" id="page-title">Dashboard</span>

            <!-- Cart shortcut + logged-in user (links to profile) -->
            <a href="#cart" class="btn btn-outline-primary ms-auto" aria-label="Cart"><i class="bi bi-cart3"></i></a>
            <a href="#profile" class="text-decoration-none user-chip ms-2">
                <span class="avatar">AK</span>
                <span class="d-none d-sm-inline">Anna Kovač</span>
            </a>
        </header>

        <!-- ===== SPA views: every <section> is one page, loaded from views/ ===== -->
        <!-- NOTE: the LAST section is the default view (see css/spapp.css) -->
        <!-- EXTERNAL API PLAN: #checkout will show live exchange rates from a public
             API (placeholder card in views/checkout.html). -->
        <main id="spapp" role="main">
            <section id="login" data-load="login.html"></section>
            <section id="register" data-load="register.html"></section>
            <section id="products" data-load="products.html"></section>
            <section id="product-details" data-load="product-details.html"></section>
            <section id="cart" data-load="cart.html"></section>
            <section id="checkout" data-load="checkout.html"></section>
            <section id="orders" data-load="orders.html"></section>
            <section id="profile" data-load="profile.html"></section>
            <section id="error_404" data-load="404.html"></section>
            <section id="dashboard" data-load="dashboard.html"></section>
        </main>
    </div>
</div>

<!-- Libraries -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- SPApp router + our application -->
<script src="js/lib/jquery.spapp.js"></script>
<script src="js/app.js"></script>
</body>
</html>
